<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Clipe — PEDIATRIA E ESPECIALIDADES">
  <title>Clipe — PEDIATRIA E ESPECIALIDADES</title>
  <g transform="translate(141 -2) scale(1.1)">
